# 完整配置参考：https://github.com/MetaCubeX/mihomo/blob/Meta/docs/config.yaml

tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true

# DNS封禁原理（已知大概率被封的DOT/DOH，需要根据本地ISP自行测试）
# 🤔 强烈推荐不要写域名形式的DOT/DOH，有些海外域名对应的多个IP都已被封禁，只有一个IP可用，可能因为超出DNS查询时间以失败结束（还没查到可以访问的DNS）

# DNS整体思路
# 1. DOT IP访问做兜底处理：需要国外DNS且ISP无法控制的（不是特别在意隐私国内也可以）
#     2.0 解析代理域名的DNS：由于ISP经常会污染代理域名，所以需要DOT/DOH访问
#     2.1 默认DNS：国内的普通DNS快速访问国内站点
#     2.2 一定范围的国内域名策略：快速访问
#     2.3 一定范围的国外域名策略：需要用DOT/DOH访问，避免DNS泄漏（不希望ISP知道我访问什么站点）

# 常用DNS服务
# 腾讯云
# tls://dot.pub
# https://doh.pub/dns-query
# 阿里云
# tls://dns.alidns.com
# tls://120.53.53.53 (377ms)
# https://dns.alidns.com/dns-query
# https://1.12.12.12/dns-query (323ms)
# 阿里云
# tls://223.5.5.5 (325ms)
# tls://223.6.6.6 (319ms)
# https://223.5.5.5/dns-query (310ms)
# https://223.6.6.6/dns-query (312ms)
# GoogleDNS
# tls://8.8.8.8
# tls://dns.google
# clouflare
# tls://1.1.1.1
# https://1.1.1.1/dns-query （1592ms）
# https://1.0.0.1/dns-query（1619ms）
# tls://security.cloudflare-dns.com(1114ms)

dns:
  use-system-hosts: true
  enable: true
  ipv6: true
  use-hosts: true
  # dns根据rules代理，让代理服务器帮助走nameserver、fallback...
  respect-rules: false
  cache-algorithm: lru
  enhanced-mode: fake-ip
  # 在默认fake-ip-mode: blacklist下所有未在fake-ip-filter匹配的地址，全部返回fake-ip
  # 在默认fake-ip-mode: whitelist下所有在fake-ip-filter匹配的地址，全部返回fake-ip
  # fake-ip-filter:
  # - 1.1.1.1
  default-nameserver: # 兜底nameserver、proxy-server-nameserver DNS是域名的情况如tls://域名（DOT、DOH）
    - tls://one.one.one.one
    - https://cloudflare-dns.com/dns-query
    - tls://8.8.4.4
  proxy-server-nameserver:
    - tls://one.one.one.one
    - https://cloudflare-dns.com/dns-query
    - tls://8.8.4.4
  # 优先于nameserver/fallback规则
  nameserver-policy:
    "geosite:openai,google,anthropic,cloudflare": [114.114.114.114] # 备用：1.0.0.1, 8.8.4.4, tls://8.8.4.4, tls://1.0.0.1
    "geosite:cn": [114.114.114.114] # 对国内geosite
    "rule-set:icloud,apple,direct,applications": [114.114.114.114]
    "geosite:gfw,greatfire": [tls://1.0.0.1, tls://8.8.4.4] # 对geosite中的gfw、greatfire
    "rule-set:gfw": [tls://1.0.0.1, tls://8.8.4.4]
  # 默认DNS
  nameserver:
    - 114.114.114.114
  # 直连dns查询
  direct-nameserver:
    - 114.114.114.114
# ip嗅探域名
sniffer:
  enable: true
  # 对 redir-host 类型识别的流量进行强制嗅探
  force-dns-mapping: true
  # 对所有未获取到域名的流量进行强制嗅探
  parse-pure-ip: true
  # 是否使用嗅探结果作为实际访问，默认为 true
  override-destination: true
  sniff:
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

# GEO相关内容默认采用 https://github.com/Loyalsoldier开发的
# https://github.com/Loyalsoldier/v2ray-rules-dat

# 参考：https://github.com/Loyalsoldier/clash-rules?tab=readme-ov-file
rule-providers:
  reject:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt"
    path: ./ruleset/reject.yaml
    interval: 86400

  icloud:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/icloud.txt"
    path: ./ruleset/icloud.yaml
    interval: 86400

  apple:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/apple.txt"
    path: ./ruleset/apple.yaml
    interval: 86400

  google:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/google.txt"
    path: ./ruleset/google.yaml
    interval: 86400

  proxy:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/proxy.txt"
    path: ./ruleset/proxy.yaml
    interval: 86400

  direct:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.txt"
    path: ./ruleset/direct.yaml
    interval: 86400

  private:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/private.txt"
    path: ./ruleset/private.yaml
    interval: 86400

  gfw:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/gfw.txt"
    path: ./ruleset/gfw.yaml
    interval: 86400

  tld-not-cn:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/tld-not-cn.txt"
    path: ./ruleset/tld-not-cn.yaml
